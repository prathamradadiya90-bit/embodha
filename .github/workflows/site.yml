name: Site

on:
  push:
    paths: ["apps/site/**", ".github/workflows/site.yml"]
  pull_request:
    paths: ["apps/site/**", ".github/workflows/site.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/site/package-lock.json
      - run: npm ci
      # Builds every page with sample details, checks every link and that nothing loads from outside.
      - run: npm test
      # Until site.config.json is filled in this warns and highlights the gaps; switch to build:release once it is.
      - run: npm run build
